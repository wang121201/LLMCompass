# GDDR6 aggregate profile for RTX 4000 Ada, not a command-level model.
# Nominal card: 20 GiB / 160-bit / 18 Gb/s => 360 decimal GB/s raw.
# Calibrated at profiler base memory clock 8550 MHz: 17.1 Gb/s, 342 GB/s raw.
# Ten x16 lanes and the address map are explicit modeling assumptions.
# Historical hbm-* keys and the HBM transaction target mean primary DRAM.
hbm-standard=GDDR6-aggregate-v1
hbm-stacks=1
hbm-capacity-bytes=21474836480
hbm-channels=10
hbm-pseudo-channels=1
hbm-channel-width-bits=16
hbm-burst-length=16
hbm-pin-rate-gbps=17.1
hbm-data-rate-per-command-clock=1
hbm-bank-groups-per-pseudo-channel=4
hbm-banks-per-group=4
hbm-channel-row-size-bytes=2048
hbm-interleave-bytes=256
hbm-service-group-channels=1
hbm-service-quantum-bytes=4096
hbm-queue-depth=32
hbm-address-mapping-ns=0
# Read latency and common efficiency are independently calibrated.
# Write latency and direction switches remain exploratory; see Ada evidence.
hbm-read-latency-ns=153.706647933
hbm-write-latency-ns=140
hbm-read-to-write-ns=8
hbm-write-to-read-ns=8
hbm-bandwidth-efficiency=0.961886648136
